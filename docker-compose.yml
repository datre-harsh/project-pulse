version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: project_pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - project_pulse_pgdata:/var/lib/postgresql/data
volumes:
  project_pulse_pgdata:
