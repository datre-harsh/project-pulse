<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .request, .response { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Profile API Test Case</h1>
    
    <div class="test-section">
        <h2>Test 1: GET /api/students/profile</h2>
        <button onclick="testGetProfile()">Test Get Profile</button>
        <div id="getProfileResult"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 2: PUT /api/students/profile</h2>
        <label>First Name: <input type="text" id="firstName" value="John"></label><br><br>
        <label>Last Name: <input type="text" id="lastName" value="Doe"></label><br><br>
        <label>Email: <input type="email" id="email" value="john.doe@test.com"></label><br><br>
        <button onclick="testUpdateProfile()">Test Update Profile</button>
        <div id="updateProfileResult"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 3: Verify Update</h2>
        <button onclick="testVerifyUpdate()">Verify Profile Update</button>
        <div id="verifyResult"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        async function testGetProfile() {
            const resultDiv = document.getElementById('getProfileResult');
            resultDiv.innerHTML = '<div class="request">GET /api/students/profile</div>';
            
            try {
                const response = await fetch(`${API_BASE}/students/profile`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML += `
                        <div class="success">✅ SUCCESS (Status: ${response.status})</div>
                        <div class="response">Response: ${JSON.stringify(data, null, 2)}</div>
                    `;
                } else {
                    resultDiv.innerHTML += `
                        <div class="error">❌ FAILED (Status: ${response.status})</div>
                        <div class="response">Error: ${JSON.stringify(data, null, 2)}</div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML += `
                    <div class="error">❌ NETWORK ERROR</div>
                    <div class="response">Error: ${error.message}</div>
                `;
            }
        }
        
        async function testUpdateProfile() {
            const resultDiv = document.getElementById('updateProfileResult');
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            
            resultDiv.innerHTML = `
                <div class="request">PUT /api/students/profile</div>
                <div class="request">Body: {
                    "firstName": "${firstName}",
                    "lastName": "${lastName}",
                    "email": "${email}"
                }</div>
            `;
            
            try {
                const response = await fetch(`${API_BASE}/students/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        firstName: firstName,
                        lastName: lastName,
                        email: email
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML += `
                        <div class="success">✅ SUCCESS (Status: ${response.status})</div>
                        <div class="response">Response: ${JSON.stringify(data, null, 2)}</div>
                    `;
                } else {
                    resultDiv.innerHTML += `
                        <div class="error">❌ FAILED (Status: ${response.status})</div>
                        <div class="response">Error: ${JSON.stringify(data, null, 2)}</div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML += `
                    <div class="error">❌ NETWORK ERROR</div>
                    <div class="response">Error: ${error.message}</div>
                `;
            }
        }
        
        async function testVerifyUpdate() {
            const resultDiv = document.getElementById('verifyResult');
            resultDiv.innerHTML = '<div class="request">GET /api/students/profile (to verify update)</div>';
            
            try {
                const response = await fetch(`${API_BASE}/students/profile`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML += `
                        <div class="success">✅ VERIFICATION COMPLETE</div>
                        <div class="response">Current Profile: ${JSON.stringify(data, null, 2)}</div>
                    `;
                } else {
                    resultDiv.innerHTML += `
                        <div class="error">❌ VERIFICATION FAILED</div>
                        <div class="response">Error: ${JSON.stringify(data, null, 2)}</div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML += `
                    <div class="error">❌ NETWORK ERROR</div>
                    <div class="response">Error: ${error.message}</div>
                `;
            }
        }
        
        // Auto-run first test on page load
        window.onload = function() {
            console.log('Profile API Test Page Loaded');
            console.log('Make sure backend is running on http://localhost:8080');
        };
    </script>
</body>
</html>
